<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="확산 지표와 가치 지표" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>확산 지표와 가치 지표</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12393A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C4532F"/></marker></defs><rect width="1000" height="470" fill="#F1EFE8"/><text fill="#C4532F" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="114.0">확산 지표</tspan></text><rect x="200" y="30" width="380" height="168" rx="14" fill="#E8D3C8" stroke="#C4532F" stroke-width="2"/><text fill="#C4532F" font-size="38" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="224.0" y="72.0">15배</tspan></text><text x="224.0" y="116.0" fill="#12393A" font-size="16" font-weight="700" text-anchor="start">Microsoft 365 안의 활성 에이전트, 전년 대비</text><text x="224.0" y="171.5" fill="#5E6B68" font-size="13.5" font-weight="400" text-anchor="start">Microsoft Work Trend Index(2026-05) [조사-벤더]</text><rect x="600" y="30" width="380" height="168" rx="14" fill="#E8D3C8" stroke="#C4532F" stroke-width="2"/><text fill="#C4532F" font-size="38" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="624.0" y="72.0">44%</tspan></text><text x="624.0" y="116.0" fill="#12393A" font-size="16" font-weight="700" text-anchor="start">AI가 전사로 확산되고 있다는 응답 (1년 전 38%)</text><text x="624.0" y="171.5" fill="#5E6B68" font-size="13.5" font-weight="400" text-anchor="start">맥킨지 State of AI 2026 보도 [조사, 보도 경유]</text><text fill="#2F6E6A" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="352.0">가치 지표</tspan></text><rect x="200" y="268" width="380" height="168" rx="14" fill="#D3E4E1" stroke="#2F6E6A" stroke-width="2"/><text fill="#2F6E6A" font-size="38" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="224.0" y="310.0">37%</tspan></text><text x="224.0" y="354.0" fill="#12393A" font-size="16" font-weight="700" text-anchor="start">AI가 EBIT에 기여했다는 응답, 1년 전과 사실상</text><text x="224.0" y="374.8" fill="#12393A" font-size="16" font-weight="700" text-anchor="start">같음</text><text x="224.0" y="409.5" fill="#5E6B68" font-size="13.5" font-weight="400" text-anchor="start">맥킨지 State of AI 2026 보도 [조사, 보도 경유]</text><rect x="600" y="268" width="380" height="168" rx="14" fill="#D3E4E1" stroke="#2F6E6A" stroke-width="2"/><text fill="#2F6E6A" font-size="38" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="624.0" y="310.0">12%</tspan></text><text x="624.0" y="354.0" fill="#12393A" font-size="16" font-weight="700" text-anchor="start">AI 가치를 비용 대비 일관되게 평가하는 조직</text><text x="624.0" y="409.5" fill="#5E6B68" font-size="13.5" font-weight="400" text-anchor="start">KPMG Global AI Pulse 2026년 3분기 [조사]</text><line x1="200" y1="233" x2="980" y2="233" stroke="#5E6B68" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="490" y="219" width="200" height="28" fill="#F1EFE8"/><text fill="#5E6B68" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="590.0" y="233.0">서로 다른 조사·응답자</tspan></text></svg>
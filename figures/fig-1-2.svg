<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="끼어들기 방식의 스펙트럼" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>끼어들기 방식의 스펙트럼</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12393A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C4532F"/></marker></defs><rect width="1000" height="360" fill="#F1EFE8"/><rect x="30" y="40" width="212" height="150" rx="12" fill="#E8D3C8" stroke="#C4532F" stroke-width="1.8"/><text x="136.0" y="99.8" fill="#12393A" font-size="18" font-weight="700" text-anchor="middle">넛지</text><text x="136.0" y="124.2" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">dots — 프롬프트나 예약</text><text x="136.0" y="143.7" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">없이 먼저 보낸다</text><line x1="136.0" y1="190" x2="136.0" y2="253" stroke="#C9CCC4" stroke-width="1.8"/><circle cx="136.0" cy="262" r="8" fill="#C4532F"/><rect x="266" y="40" width="212" height="150" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="372.0" y="90.0" fill="#12393A" font-size="18" font-weight="700" text-anchor="middle">다이얼</text><text x="372.0" y="114.5" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">Muse — 빈도를 사용자가</text><text x="372.0" y="133.9" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">말로 끄거나 줄이거나</text><text x="372.0" y="153.4" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">늘린다</text><line x1="372.0" y1="190" x2="372.0" y2="253" stroke="#C9CCC4" stroke-width="1.8"/><circle cx="372.0" cy="262" r="8" fill="#C4532F"/><rect x="502" y="40" width="212" height="150" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="608.0" y="78.3" fill="#12393A" font-size="18" font-weight="700" text-anchor="middle">아침 브리프 + 필요할</text><text x="608.0" y="101.8" fill="#12393A" font-size="18" font-weight="700" text-anchor="middle">때만</text><text x="608.0" y="126.2" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">Claude Duet — 하루 1회</text><text x="608.0" y="145.7" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">브리프, 낮에는 주의가</text><text x="608.0" y="165.2" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">필요할 때만</text><line x1="608.0" y1="190" x2="608.0" y2="253" stroke="#C9CCC4" stroke-width="1.8"/><circle cx="608.0" cy="262" r="8" fill="#2F6E6A"/><rect x="738" y="40" width="212" height="150" rx="12" fill="#D3E4E1" stroke="#2F6E6A" stroke-width="1.8"/><text x="844.0" y="90.0" fill="#12393A" font-size="18" font-weight="700" text-anchor="middle">조건을 건 예약 작업</text><text x="844.0" y="114.5" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">Pulse 후속 — 사용자가</text><text x="844.0" y="133.9" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">걸고, 시간당 1회를 넘기지</text><text x="844.0" y="153.4" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">않는다</text><line x1="844.0" y1="190" x2="844.0" y2="253" stroke="#C9CCC4" stroke-width="1.8"/><circle cx="844.0" cy="262" r="8" fill="#2F6E6A"/><path d="M38,262 L946,262" fill="none" stroke="#12393A" stroke-width="2" marker-end="url(#mi)" marker-start="url(#mi)"/><text fill="#C4532F" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="302.0">에이전트가 먼저 정한다</tspan></text><text fill="#2F6E6A" font-size="17" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="950.0" y="302.0">사용자가 먼저 정한다</tspan></text><text fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="302.0">끼어드는 시점과 빈도</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="에이전트 신원의 수명과 소유권 이전 세 방식" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>에이전트 신원의 수명과 소유권 이전 세 방식</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12393A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C4532F"/></marker></defs><rect width="1000" height="460" fill="#F1EFE8"/><rect x="26" y="30" width="172" height="96" rx="12" fill="#F1EFE8" stroke="#5E6B68" stroke-width="1.8" stroke-dasharray="6 5"/><text x="112.0" y="62.8" fill="#12393A" font-size="18" font-weight="700" text-anchor="middle">등록</text><text x="112.0" y="87.2" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">「디지털 워커의</text><text x="112.0" y="106.7" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">시대」</text><rect x="223" y="30" width="172" height="96" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="309.0" y="62.8" fill="#12393A" font-size="18" font-weight="700" text-anchor="middle">위임(OBO)</text><text x="309.0" y="87.2" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">사용자 대신 행동할</text><text x="309.0" y="106.7" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">때 위임을 싣는다</text><rect x="420" y="30" width="172" height="96" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="506.0" y="62.8" fill="#12393A" font-size="18" font-weight="700" text-anchor="middle">활동 기록</text><text x="506.0" y="87.2" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">에이전트 식별자와</text><text x="506.0" y="106.7" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">함께 남긴다</text><rect x="617" y="30" width="172" height="96" rx="12" fill="#E8D3C8" stroke="#C4532F" stroke-width="2.5"/><text x="703.0" y="72.5" fill="#12393A" font-size="18" font-weight="700" text-anchor="middle">소유권 이전</text><text x="703.0" y="97.0" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">만든 사람이 떠날 때</text><rect x="814" y="30" width="172" height="96" rx="12" fill="#F1EFE8" stroke="#5E6B68" stroke-width="1.8" stroke-dasharray="6 5"/><text x="900.0" y="62.8" fill="#12393A" font-size="18" font-weight="700" text-anchor="middle">폐기</text><text x="900.0" y="87.2" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">「디지털 워커의</text><text x="900.0" y="106.7" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">시대」</text><path d="M201,78.0 L218,78.0" fill="none" stroke="#12393A" stroke-width="2" marker-end="url(#mi)"/><path d="M398,78.0 L415,78.0" fill="none" stroke="#12393A" stroke-width="2" marker-end="url(#mi)"/><path d="M595,78.0 L612,78.0" fill="none" stroke="#12393A" stroke-width="2" marker-end="url(#mi)"/><path d="M792,78.0 L809,78.0" fill="none" stroke="#12393A" stroke-width="2" marker-end="url(#mi)"/><line x1="703.0" y1="126" x2="703.0" y2="176" stroke="#12393A" stroke-width="2"/><line x1="176.0" y1="176" x2="826.0" y2="176" stroke="#12393A" stroke-width="2"/><path d="M176.0,176 L176.0,209" fill="none" stroke="#12393A" stroke-width="2" marker-end="url(#mi)"/><path d="M501.0,176 L501.0,209" fill="none" stroke="#12393A" stroke-width="2" marker-end="url(#mi)"/><path d="M826.0,176 L826.0,209" fill="none" stroke="#12393A" stroke-width="2" marker-end="url(#mi)"/><rect x="26" y="214" width="300" height="148" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="176.0" y="263.7" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">인사 트리거 자동 이전</text><text x="176.0" y="287.3" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">Microsoft Entra — 스폰서가 떠나면</text><text x="176.0" y="306.1" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">퇴사일에 스폰서십(책임)이 관리자에게</text><text x="176.0" y="325.0" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">넘어간다</text><rect x="351" y="214" width="300" height="148" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="501.0" y="263.7" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">계정 제거 자동 재지정</text><text x="501.0" y="287.3" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">ChatGPT Enterprise — 소유권은</text><text x="501.0" y="306.1" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">워크스페이스 소유자에게, 비공개</text><text x="501.0" y="325.0" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">대화·파일은 넘어가지 않는다</text><rect x="676" y="214" width="300" height="148" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="826.0" y="263.7" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">관리자 수동 재지정</text><text x="826.0" y="287.3" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">Copilot Studio — 새 소유자가 기존 대화</text><text x="826.0" y="306.1" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">기록 전부에 접근할 수 있다. Gemini</text><text x="826.0" y="325.0" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">Enterprise도 관리자가 넘긴다</text><text fill="#C4532F" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="410.0">자격 증명 토큰은 넘어가지도 사라지지도 않고 정지된 채 남을 수 있다 — 따로 폐기하거나 새 토큰으로 넘긴다</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="승인 3층과 강제 장치" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>승인 3층과 강제 장치</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12393A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C4532F"/></marker></defs><rect width="1000" height="470" fill="#F1EFE8"/><text fill="#5E6B68" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="40.0" y="34.0">프롬프트에만 적은 승인</tspan></text><rect x="40" y="120" width="290" height="260" rx="12" fill="#F1EFE8" stroke="#5E6B68" stroke-width="1.8" stroke-dasharray="6 5"/><text x="185.0" y="186.4" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">"무엇이든 하기 전에 먼저</text><text x="185.0" y="208.5" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">확인하라"</text><text x="185.0" y="232.1" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">모델이 읽는 글이다. 모델이 지시를</text><text x="185.0" y="250.9" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">놓치면 규칙도 함께 사라진다. 메일함</text><text x="185.0" y="269.8" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">사고에서는 긴 맥락을 줄이는 압축 중에</text><text x="185.0" y="288.6" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">행동하지 말라는 마지막 지시를</text><text x="185.0" y="307.5" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">건너뛰었을 수 있다는 당사자 추정이</text><text x="185.0" y="326.3" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">나왔다.</text><line x1="370" y1="40" x2="370" y2="450" stroke="#C9CCC4" stroke-width="1.8"/><text fill="#12393A" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="410.0" y="34.0">구조로 강제한 승인 — 화면 버튼은 확인 수단, 실행은 권한·검사가 막는다</tspan></text><rect x="410" y="60" width="220" height="112" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="520.0" y="110.9" fill="#12393A" font-size="19" font-weight="700" text-anchor="middle">자율 허용</text><text x="520.0" y="135.6" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">읽기·요약·브리프·초안</text><path d="M634,116.0 L664,116.0" fill="none" stroke="#12393A" stroke-width="2" marker-end="url(#mi)"/><rect x="670" y="60" width="300" height="112" rx="12" fill="#D3E4E1" stroke="#2F6E6A" stroke-width="1.8"/><text x="820.0" y="111.2" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">읽기 전용 계정 · 허용 데이터 범위 ·</text><text x="820.0" y="132.0" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">활동 기록 · 표본 감사</text><rect x="410" y="194" width="220" height="112" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="520.0" y="244.9" fill="#12393A" font-size="19" font-weight="700" text-anchor="middle">실행 전 승인</text><text x="520.0" y="269.6" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">발송·결제·서명·삭제</text><path d="M634,250.0 L664,250.0" fill="none" stroke="#12393A" stroke-width="2" marker-end="url(#mi)"/><rect x="670" y="194" width="300" height="112" rx="12" fill="#D3E4E1" stroke="#2F6E6A" stroke-width="1.8"/><text x="820.0" y="224.4" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">수신자·내용·첨부·대상 버전에 묶인</text><text x="820.0" y="245.2" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">승인 기록 · 승인된 값만 실행하는</text><text x="820.0" y="266.0" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">서버 측 검사(이 책의 권고) · 금액</text><text x="820.0" y="286.8" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">한도</text><rect x="410" y="328" width="220" height="112" rx="12" fill="#E8D3C8" stroke="#C4532F" stroke-width="2.5"/><text x="520.0" y="378.9" fill="#12393A" font-size="19" font-weight="700" text-anchor="middle">승인해도 금지</text><text x="520.0" y="403.6" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">증권 거래·계좌 간 이체</text><path d="M634,384.0 L664,384.0" fill="none" stroke="#C4532F" stroke-width="3" marker-end="url(#mc)"/><rect x="670" y="328" width="300" height="112" rx="12" fill="#D3E4E1" stroke="#2F6E6A" stroke-width="1.8"/><text x="820.0" y="379.2" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">에이전트 계정에 권한 없음 · 환경</text><text x="820.0" y="400.0" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">분리 · 금지 목록 1장</text></svg>
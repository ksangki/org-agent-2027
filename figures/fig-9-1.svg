<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="SaaS의 세 계층과 압력을 받는 곳" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>SaaS의 세 계층과 압력을 받는 곳</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12393A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C4532F"/></marker></defs><rect width="1000" height="420" fill="#F1EFE8"/><rect x="40" y="30" width="470" height="110" rx="12" fill="#E8D3C8" stroke="#C4532F" stroke-width="1.8"/><text x="275.0" y="80.2" fill="#12393A" font-size="20" font-weight="700" text-anchor="middle">사용자 화면</text><text x="275.0" y="105.2" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">에이전트·사내 앱</text><path d="M592,85.0 L518,85.0" fill="none" stroke="#C4532F" stroke-width="3" marker-end="url(#mc)"/><text x="612.0" y="68.0" fill="#C4532F" font-size="17" font-weight="700" text-anchor="start">에이전트가 화면을 가져간다</text><text x="612.0" y="91.6" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="start">관점 B — 베니오프 "인터페이스 혁명", SAP, Workday</text><rect x="40" y="160" width="470" height="110" rx="12" fill="#E8D3C8" stroke="#C4532F" stroke-width="1.8"/><text x="275.0" y="210.2" fill="#12393A" font-size="20" font-weight="700" text-anchor="middle">업무 로직</text><text x="275.0" y="235.2" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">비즈니스 앱이 CRUD 데이터베이스 위에 얹은 것</text><path d="M592,215.0 L518,215.0" fill="none" stroke="#C4532F" stroke-width="3" marker-end="url(#mc)"/><text x="612.0" y="198.0" fill="#C4532F" font-size="17" font-weight="700" text-anchor="start">로직이 에이전트 쪽으로 옮겨 간다</text><text x="612.0" y="221.6" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="start">관점 A — 나델라(2024-12), 맥더멋(2025-05)</text><rect x="40" y="290" width="470" height="110" rx="12" fill="#D3E4E1" stroke="#2F6E6A" stroke-width="1.8"/><text x="275.0" y="340.2" fill="#12393A" font-size="20" font-weight="700" text-anchor="middle">데이터·권한·의미 계층</text><text x="275.0" y="365.2" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">기록 시스템(SoR)</text><line x1="518" y1="345.0" x2="592" y2="345.0" stroke="#2F6E6A" stroke-width="2.5"/><text x="612.0" y="328.0" fill="#2F6E6A" font-size="17" font-weight="700" text-anchor="start">벤더가 내주면서 지키려는 계층</text><text x="612.0" y="351.6" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="start">Salesforce AIforce, Workday Data Cloud — 본인</text><text x="612.0" y="370.5" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="start">권한 안의 데이터만</text></svg>
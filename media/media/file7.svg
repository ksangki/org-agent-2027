<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 474" role="img" aria-label="데이터 등급에서 배치 위치로" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>데이터 등급에서 배치 위치로</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12393A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C4532F"/></marker></defs><rect width="1000" height="474" fill="#F1EFE8"/><text fill="#12393A" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="129.0" y="50.0">배치 위치</tspan></text><text fill="#12393A" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="828.0" y="50.0">통제 책임</tspan></text><text fill="#C4532F" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="320.0" y="40.0">반출 금지 등급</tspan></text><text fill="#5E6B68" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="320.0" y="64.9">개인정보·핵심 기술</tspan><tspan x="320.0" y="83.1">자료</tspan></text><rect x="262" y="112" width="116" height="164" rx="14" fill="#E8D3C8" stroke="#C4532F" stroke-width="1.8"/><text fill="#C4532F" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="320.0" y="254.0">사내까지</tspan></text><text fill="#12393A" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="456.0" y="40.0">내부 업무 자료</tspan></text><rect x="398" y="112" width="116" height="252" rx="14" fill="#D3E4E1" stroke="#2F6E6A" stroke-width="1.8"/><text fill="#2F6E6A" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="456.0" y="332.2">사설</tspan><tspan x="456.0" y="351.8">클라우드까지</tspan></text><text fill="#12393A" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="592.0" y="40.0">공개 자료</tspan></text><rect x="534" y="112" width="116" height="340" rx="14" fill="#D3E4E1" stroke="#2F6E6A" stroke-width="1.8"/><text fill="#2F6E6A" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="592.0" y="420.2">퍼블릭</tspan><tspan x="592.0" y="439.8">클라우드까지</tspan></text><rect x="24" y="112" width="210" height="76" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="129.0" y="155.9" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">온디바이스</text><rect x="678" y="112" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="828.0" y="144.8" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">공동</text><text x="828.0" y="167.1" fill="#5E6B68" font-size="13.5" font-weight="400" text-anchor="middle">기기 관리는 조직, 모델·OS는 플랫폼</text><line x1="234" y1="150.0" x2="260" y2="150.0" stroke="#C9CCC4" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="652" y1="150.0" x2="678" y2="150.0" stroke="#C9CCC4" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="24" y="200" width="210" height="76" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="129.0" y="243.9" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">사내(온프레미스)</text><rect x="678" y="200" width="300" height="76" rx="12" fill="#E8D3C8" stroke="#C4532F" stroke-width="2.5"/><text x="828.0" y="232.8" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">조직 전부</text><text x="828.0" y="255.1" fill="#5E6B68" font-size="13.5" font-weight="400" text-anchor="middle">인증·패치·감시·라이선스</text><line x1="234" y1="238.0" x2="260" y2="238.0" stroke="#C9CCC4" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="652" y1="238.0" x2="678" y2="238.0" stroke="#C9CCC4" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="24" y="288" width="210" height="76" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="129.0" y="331.9" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">사설 클라우드</text><rect x="678" y="288" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="828.0" y="320.8" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">공동</text><text x="828.0" y="343.1" fill="#5E6B68" font-size="13.5" font-weight="400" text-anchor="middle">조직과 클라우드 사업자, 계약으로 나눈다</text><line x1="234" y1="326.0" x2="260" y2="326.0" stroke="#C9CCC4" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="652" y1="326.0" x2="678" y2="326.0" stroke="#C9CCC4" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="24" y="376" width="210" height="76" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="129.0" y="419.9" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">퍼블릭 클라우드</text><rect x="678" y="376" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="828.0" y="408.8" fill="#12393A" font-size="16" font-weight="700" text-anchor="middle">공동</text><text x="828.0" y="431.1" fill="#5E6B68" font-size="13.5" font-weight="400" text-anchor="middle">사업자, 조직은 계정·데이터 반출 통제</text><line x1="234" y1="414.0" x2="260" y2="414.0" stroke="#C9CCC4" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="652" y1="414.0" x2="678" y2="414.0" stroke="#C9CCC4" stroke-width="1.5" stroke-dasharray="5 5"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="맡길 것과 지킬 것" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>맡길 것과 지킬 것</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12393A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C4532F"/></marker></defs><rect width="1000" height="560" fill="#F1EFE8"/><rect x="24" y="20" width="440" height="520" rx="16" fill="#D3E4E1" stroke="#2F6E6A" stroke-width="1.5"/><text fill="#2F6E6A" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="244.0" y="52.0">에이전트에 맡기는 것</tspan></text><text fill="#2F6E6A" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="56.0" y="96.0">1장</tspan></text><text fill="#12393A" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="108.0" y="96.0">알림·브리프의 생성과 전달</tspan></text><text fill="#2F6E6A" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="56.0" y="140.0">2장</tspan></text><text fill="#12393A" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="108.0" y="140.0">현업이 앱·에이전트를 만드는 일</tspan></text><text fill="#2F6E6A" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="56.0" y="184.0">3장</tspan></text><text fill="#12393A" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="108.0" y="184.0">기록·요약·검색</tspan></text><text fill="#2F6E6A" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="56.0" y="228.0">4장</tspan></text><text fill="#12393A" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="108.0" y="228.0">위임된 범위 안의 작업</tspan></text><text fill="#2F6E6A" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="56.0" y="272.0">5장</tspan></text><text fill="#12393A" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="108.0" y="272.0">되돌릴 수 있는 행동</tspan></text><text fill="#2F6E6A" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="56.0" y="316.0">6장</tspan></text><text fill="#12393A" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="108.0" y="316.0">등급별로 허용된 위치에서의 처리</tspan></text><text fill="#2F6E6A" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="56.0" y="360.0">8장</tspan></text><text fill="#12393A" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="108.0" y="360.0">원장 기록의 수집과 집계</tspan></text><text fill="#2F6E6A" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="56.0" y="404.0">9장</tspan></text><text fill="#12393A" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="108.0" y="404.0">주변부 화면·워크플로</tspan></text><line x1="48" y1="452" x2="440" y2="452" stroke="#2F6E6A" stroke-width="1.2" stroke-dasharray="5 5"/><text fill="#12393A" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="244.0" y="483.5">공통점: 되돌릴 수 있고, 기록이 남고, 능력 안에 드는</tspan><tspan x="244.0" y="504.5">과제</tspan></text><rect x="488" y="20" width="488" height="520" rx="16" fill="#E8D3C8" stroke="#C4532F" stroke-width="1.5"/><text fill="#C4532F" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="732.0" y="52.0">조직이 지키는 것 — 다섯 설계</tspan></text><rect x="512" y="78" width="440" height="78" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="732.0" y="111.5" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">맥락 범위 · 3장</text><text x="732.0" y="135.1" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">어느 시스템에 닿고 무엇을 조직 기억으로 올리는가</text><rect x="512" y="168" width="440" height="78" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="732.0" y="201.5" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">신원 · 4장</text><text x="732.0" y="225.1" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">누구의 이름으로 일하고, 떠날 때 누가 넘겨받는가</text><rect x="512" y="258" width="440" height="78" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="732.0" y="291.5" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">승인 지점 · 5장</text><text x="732.0" y="315.1" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">승인 3층을 계정 권한과 결정적 UI로 강제</text><rect x="512" y="348" width="440" height="78" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="732.0" y="381.5" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">처리 위치 · 6·7장</text><text x="732.0" y="405.1" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">데이터 등급표, 한국 제도의 등급 체계와 일정</text><rect x="512" y="438" width="440" height="78" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="732.0" y="471.5" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">가치 기준 · 8장</text><text x="732.0" y="495.1" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">확산·가치 분리 보고, 비용·절감 시간·재작업 원장</text></svg>
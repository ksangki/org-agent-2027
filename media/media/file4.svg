<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="조직 기억의 세 단계와 승격·출처·망각 규칙" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>조직 기억의 세 단계와 승격·출처·망각 규칙</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#12393A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#C4532F"/></marker></defs><rect width="1000" height="400" fill="#F1EFE8"/><rect x="40" y="110" width="250" height="130" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="165.0" y="160.5" fill="#12393A" font-size="20" font-weight="700" text-anchor="middle">개인</text><text x="165.0" y="185.5" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">개인 정보·일정·선호는 이</text><text x="165.0" y="205.0" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">단계에만 머문다</text><rect x="375" y="110" width="250" height="130" rx="12" fill="#E8D3C8" stroke="#C4532F" stroke-width="2.5"/><text x="500.0" y="150.8" fill="#12393A" font-size="20" font-weight="700" text-anchor="middle">팀</text><text x="500.0" y="175.8" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">다수·소수 입장을 함께 적고,</text><text x="500.0" y="195.2" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">기록마다 원천 기록으로 가는</text><text x="500.0" y="214.8" fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle">출처를 둔다</text><rect x="710" y="110" width="250" height="130" rx="12" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1.8"/><text x="835.0" y="182.0" fill="#12393A" font-size="20" font-weight="700" text-anchor="middle">조직</text><path d="M294,175.0 L369,175.0" fill="none" stroke="#C4532F" stroke-width="3" marker-end="url(#mc)"/><text fill="#C4532F" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="332.5" y="38.0">승격</tspan></text><text fill="#12393A" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="332.5" y="70.0">독립된 사용자 세 명이 같은 정보를 확인</tspan></text><path d="M629,175.0 L704,175.0" fill="none" stroke="#12393A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mi)"/><text fill="#5E6B68" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="667.5" y="38.0">승격</tspan></text><text fill="#5E6B68" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="667.5" y="70.0">조건은 공개 자료 밖 — 조직이 정한다</tspan></text><rect x="375" y="290" width="585" height="72" rx="12" fill="#D3E4E1" stroke="#2F6E6A" stroke-width="1.8"/><text x="667.5" y="311.1" fill="#12393A" font-size="17" font-weight="700" text-anchor="middle">망각 — 기록 종류별 보존 기간(TTL)</text><text x="667.5" y="334.7" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">끝나기 전에 확인자에게 재확인 요청, 응답이 없으면 운영 참조에서 빼고 검토</text><text x="667.5" y="353.6" fill="#5E6B68" font-size="14.5" font-weight="400" text-anchor="middle">대기(원본 보관은 별도 정책)</text><line x1="500.0" y1="240" x2="500.0" y2="290" stroke="#2F6E6A" stroke-width="1.8" stroke-dasharray="5 5"/><line x1="835.0" y1="240" x2="835.0" y2="290" stroke="#2F6E6A" stroke-width="1.8" stroke-dasharray="5 5"/></svg>